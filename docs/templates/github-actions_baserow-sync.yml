name: Baserow Sync Workflow

on:
  workflow_dispatch:
    inputs:
      baserow_event:
        description: 'Type of Baserow event'
        required: false
        type: string
        default: 'webhook'
      row_id:
        description: 'Baserow row ID'
        required: false
        type: string
      table_id:
        description: 'Baserow table ID'
        required: false
        type: string
        default: 'all'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
          BASEROW_SKILLS_TABLE: ${{ secrets.BASEROW_SKILLS_TABLE }}
          BASEROW_EXPERIENCES_TABLE: ${{ secrets.BASEROW_EXPERIENCES_TABLE }}
          BASEROW_BLOG_TABLE: ${{ secrets.BASEROW_BLOG_TABLE }}
          # Add more table secrets as needed

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
